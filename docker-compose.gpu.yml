# Optional NVIDIA override. Requires NVIDIA drivers and Docker Desktop GPU support.
services:
  api:
    build:
      args:
        TORCH_INDEX_URL: ${TORCH_CUDA_INDEX_URL:-https://download.pytorch.org/whl/cu128}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
